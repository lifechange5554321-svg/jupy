name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Capacitor only
        run: npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Point webDir to public/ide
        run: |
          test -f public/ide/index.html
          cat > capacitor.config.json << 'JSON'
          {
            "appId": "com.lifechange.jupy",
            "appName": "Jupyter IDE",
            "webDir": "public/ide"
          }
          JSON
          cat capacitor.config.json

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Assemble APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: jupy-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
