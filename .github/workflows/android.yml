name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare assets + wrapper
        run: |
          set -e
          test -f public/ide/index.html
          test -d android-app
          rm -rf android-app/app/src/main/assets/www
          mkdir -p android-app/app/src/main/assets/www
          cp -a public/ide/. android-app/app/src/main/assets/www/
          echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties
          cd android-app
          # create missing gradlew on CI
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/

      - name: Assemble APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: jupy-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
