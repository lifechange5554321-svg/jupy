name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy public/ide into android-app assets
        run: |
          test -f public/ide/index.html
          test -f android-app/gradlew
          rm -rf android-app/app/src/main/assets/www
          mkdir -p android-app/app/src/main/assets/www
          cp -a public/ide/. android-app/app/src/main/assets/www/
          echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties
          chmod +x android-app/gradlew
          ls android-app/app/src/main/assets/www/

      - name: Assemble debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: jupy-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
